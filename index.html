<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F6FA" />

    <title>RUPE — Estúdio de Experiências Digitais</title>
    <meta
      name="description"
      content="Criamos websites, e-commerce e experiências digitais que combinam design, desenvolvimento, 3D e inteligência artificial para fazer negócios avançar."
    />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RUPE" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="RUPE — Estúdio de Experiências Digitais" />
    <meta
      property="og:description"
      content="Websites, e-commerce e experiências digitais que combinam design, desenvolvimento, 3D e inteligência artificial para fazer negócios avançar."
    />
    <meta property="og:image" content="__SITE_URL__/og-rupe.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Marca RUPE — Estúdio de Experiências Digitais" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RUPE — Estúdio de Experiências Digitais" />
    <meta
      name="twitter:description"
      content="Websites, e-commerce e experiências digitais que combinam design, desenvolvimento, 3D e inteligência artificial para fazer negócios avançar."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-rupe.jpg" />

    <link rel="icon" type="image/svg+xml" href="/rupe-mark.svg" />
    <link rel="apple-touch-icon" href="/rupe-logo.png" />

    <!-- Self-hosted: no preconnect, no third party, no request leaving this
         origin before the page paints. Only the `latin` faces are preloaded —
         they are what a Portuguese page actually renders with. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-tight-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "__SITE_URL__/#organization",
            "name": "RUPE",
            "alternateName": "RUPE Studio",
            "url": "__SITE_URL__/",
            "logo": {
              "@type": "ImageObject",
              "url": "__SITE_URL__/rupe-logo.png",
              "width": 1024,
              "height": 1024
            },
            "image": "__SITE_URL__/og-rupe.jpg",
            "description": "Estúdio de experiências digitais. Websites, e-commerce, 3D e inteligência artificial."
          },
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "url": "__SITE_URL__/",
            "name": "RUPE — Estúdio de Experiências Digitais",
            "inLanguage": "pt-PT",
            "publisher": { "@id": "__SITE_URL__/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>RUPE — Estúdio de Experiências Digitais</h1>
      <p>
        A RUPE é um estúdio de experiências digitais. Criamos websites, e-commerce e experiências
        que combinam design, desenvolvimento, 3D e inteligência artificial.
      </p>
      <p>
        Este website necessita de JavaScript para apresentar a experiência completa. Active o
        JavaScript no seu navegador para percorrer projectos, serviços e processo.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
