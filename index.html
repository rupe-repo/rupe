<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F6FA" />

    <!-- Before anything paints: the page is booting until React hydrates it
         (useBooted removes this), which is what shows the loading skeleton.
         Without JavaScript the class never appears and neither does the skeleton. -->
    <script>document.documentElement.classList.add('is-booting')</script>

    <!-- One template, three market pages. The build fills these markers once
         per market (/, /br/, /us/) from src/i18n: title, description,
         canonical, hreflang, Open Graph and JSON-LD. -->
    <!--rupe:head-->

    <link rel="icon" type="image/svg+xml" href="/rupe-mark.svg" />
    <link rel="apple-touch-icon" href="/rupe-logo.png" />

    <!-- Self-hosted: no preconnect, no third party, no request leaving this
         origin before the page paints. Only the `latin` faces are preloaded —
         they cover Portuguese and English alike. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-tight-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
  </head>
  <body>
    <div id="root"><!--rupe:app--></div>
    <!--rupe:data-->
    <!--rupe:noscript-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
